<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- v5 : politique de sécurité (CSP). Cette page garde le jeton GitHub de la synchro : aucun script en ligne, aucun eval,
     et elle ne peut parler qu'à elle-même et à l'API GitHub. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://gist.githubusercontent.com https://generativelanguage.googleapis.com https://api.openai.com https://openrouter.ai https://api.mistral.ai https://api.groq.com http://localhost:* http://127.0.0.1:* https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>AVERSE — carnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<meta name="description" content="AVERSE · carnet — notes liées et graphe. Tout reste dans ton navigateur.">
<meta name="theme-color" content="#06060a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/notes.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/ai.css">
<link rel="stylesheet" href="css/ascii.css">
<script src="js/core.js"></script>
<script src="js/wco.js"></script>
<script src="js/theme.js"></script>
<script src="js/accent.js"></script>
<script src="js/templates.js"></script>
</head>
<body>

<div class="bar">
  <div class="bar-left">
    <button class="ico-btn menu-btn" id="menuBtn" aria-label="Notes">☰</button>
    <div class="logo">AVERSE <b>/ CARNET</b></div>
    <a class="back" href="index.html">← accueil</a>
  </div>
  <div class="bar-right">
    <div class="seg">
      <button class="active" data-v="editor">Éditeur</button>
      <button data-v="graph">Graphe</button>
    </div>
    <button class="ico-btn" id="aiBtn" title="Assistant IA : résumé, flashcards, demander à mes notes… (désactivé tant que tu ne le configures pas)">IA ✦</button>
    <span class="sync-state" id="syncState" role="status" aria-live="polite" hidden></span>
    <button class="ico-btn" id="cloudBtn" title="Synchro chiffrée entre tes appareils (PC + téléphone) via un Gist GitHub secret">Synchro</button>
    <span class="sync-state" id="cloudState" role="status" aria-live="polite" hidden></span>
    <button class="ico-btn install-btn" data-install hidden>Installer</button>
    <!-- v9 : actions secondaires regroupées dans « ⋯ » sur ordinateur (la barre tient à toutes les largeurs, même en appli
         installée sous les boutons de fenêtre). Sur mobile, le menu s'efface et ses boutons défilent avec les autres. -->
    <div class="more" id="barMore">
      <button class="ico-btn more-btn" id="moreBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu" title="Plus d'actions : fichier, export, sauvegarde, apparence…">⋯</button>
      <div class="more-menu" id="moreMenu" role="menu" aria-label="Plus d'actions">
        <button class="ico-btn" id="fileBtn" role="menuitem" title="Synchro : lie le carnet à un fichier (ex. dans ton dossier OneDrive / Google Drive)">Fichier</button>
        <button class="ico-btn" id="exportBtn" role="menuitem">Export</button>
        <button class="ico-btn" id="importBtn" role="menuitem">Import</button>
        <button class="ico-btn" id="bakOut" role="menuitem" title="Tout AVERSE dans un fichier : notes, favoris, réglages (sans secrets)">Sauvegarde</button>
        <button class="ico-btn" id="bakIn" role="menuitem" title="Restaurer une sauvegarde complète (fusion)">Restaurer</button>
        <button class="ico-btn" id="styleBtn" role="menuitem" data-style-label >style : normal</button>
        <button class="ico-btn" role="menuitem" data-accent-btn title="Thème et couleur d'accent">apparence</button>
        <button class="ico-btn" role="menuitem" data-feedback-btn title="Signaler un bug, proposer une idée">signaler</button>
      </div>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <input type="file" id="bakFile" accept=".json,application/json" style="display:none">
  </div>
  <!-- v5 : sur mobile, la barre de boutons défile au doigt : flèches + fondus aux bords + petite barre de position -->
  <button class="bar-arrow l" id="barL" aria-label="Boutons précédents" hidden>‹</button>
  <button class="bar-arrow r" id="barR" aria-label="Boutons suivants" hidden>›</button>
  <div class="bar-nav" id="barNav" hidden><span id="barThumb"></span></div>
</div>

<div class="app">
  <!-- BARRE LATÉRALE -->
  <aside class="side" id="side">
    <div class="side-top">
      <input class="search" id="search" placeholder="Rechercher…">
      <div class="new-row"><button class="btn primary" id="newBtn">+ Nouvelle note</button><button class="btn ph-btn" id="photoBtn" type="button" title="Photo → note : prendre une photo ou choisir une image, le texte est lu sur ton appareil" aria-label="Photo vers note">📷</button></div>
      <select class="tpl" id="tplSel" aria-label="Modèle de note"><option value="">Note vide</option><option value="tp">Modèle : compte-rendu de TP</option><option value="cours">Modèle : fiche de cours</option><option value="stage">Modèle : journal de stage</option><option value="adressage">Modèle : plan d'adressage</option><option value="incident">Modèle : dépannage</option><option value="taches">Modèle : liste de tâches</option></select>
      <div class="tagbar" id="tagbar"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <!-- ZONE PRINCIPALE -->
  <main class="main" id="main">
    <div class="blank" id="blank" style="display:none">
      <b>Carnet vide</b>
      <div>Crée une note pour commencer à garder des traces.</div>
      <button class="btn primary" id="blankNew">+ Nouvelle note</button>
    </div>

    <div class="editor">
      <div class="ed-head">
        <input class="title-in" id="titleIn" placeholder="Titre de la note">
        <div class="ed-row">
          <span>Tags</span>
          <input class="tags-in" id="tagsIn" placeholder="séparés par des virgules">
          <button class="del" id="mdBtn" style="margin-left:auto">Exporter .md</button>
          <button class="del" id="pdfBtn" style="margin-left:0" title="Vue d'impression propre → « Enregistrer au format PDF »">PDF</button>
          <button class="del" id="shareBtn" style="margin-left:0" title="Partager cette note : lien chiffré, fichier, ou partage du téléphone">Partager</button>
          <button class="del" id="tplSaveBtn" style="margin-left:0" title="Enregistrer comme modèle (réutilisable pour tes prochaines notes)">Modèle</button>
          <button class="del" id="delBtn" style="margin-left:0">Supprimer</button>
        </div>
      </div>
      <div class="cf-bar" id="cfBar" hidden role="status"></div>
      <div class="panes-tabs">
        <button class="active" data-p="write">Écrire</button>
        <button data-p="prev">Aperçu</button>
      </div>
      <div class="panes">
        <div class="pane write shown" id="paneWrite">
          <textarea id="bodyIn" placeholder="Écris ici…&#10;&#10;# Titre   **gras**   *italique*   `code`&#10;- liste   1. numérotée   - [ ] tâche&#10;```bloc de code```   | tableau |   > citation&#10;[[Lien vers une note]]   [texte](https://lien.fr)"></textarea>
        </div>
        <div class="pane" id="panePrev"><div id="preview"></div></div>
      </div>
      <div class="att-box" id="attBox" aria-label="Pièces jointes"></div>
      <div class="backlinks" id="backlinks"></div>
    </div>

    <div class="graph-wrap" id="graphWrap">
      <canvas id="graph"></canvas>
      <div class="graph-legend" id="graphLegend"></div>
      <div class="graph-tools">
        <select id="graphTag" aria-label="Filtrer par tag"><option value="">tous les tags</option></select>
        <select id="graphLabels" aria-label="Étiquettes" title="Étiquettes des nœuds"><option value="auto">étiquettes : auto</option><option value="all">étiquettes : toutes</option><option value="hover">étiquettes : survol</option></select>
        <button class="ico-btn" id="graphSem" aria-pressed="false" hidden title="Liens suggérés par le sens (IA locale)">≈ sens</button>
        <span class="graph-zoom"><button class="ico-btn" data-zoom="out" aria-label="Dézoomer">−</button><button class="ico-btn" data-zoom="fit" title="Tout voir" aria-label="Tout voir">⤢</button><button class="ico-btn" data-zoom="in" aria-label="Zoomer">+</button></span>
      </div>
      <div class="graph-edit" id="graphEdit" hidden></div>
      <div class="graph-focus" id="graphFocus" hidden></div>
      <div class="graph-hint">clic : voisins (focus) · 2e clic : ouvrir · molette / 2 doigts : zoom · glisser : déplacer · clic droit : groupe, actions</div>
      <div class="graph-empty" id="graphEmpty" style="display:none">Aucune note à afficher.</div>
    </div>
  </main>
</div>

<script src="js/backup.js"></script>
<script src="js/math.js"></script>
<script src="js/keys.js"></script>
<script src="js/pwa.js"></script>
<script src="js/ctxmenu.js"></script>
<script src="js/data.js"></script>
<script src="js/feedback.js"></script>
<script src="js/eggs.js"></script>
<script src="js/rain.js"></script>
<script src="js/notes-graph.js"></script>
<script src="js/md.js"></script>
<script src="js/attach.js"></script>
<script src="js/notes.js"></script>
<script src="js/notes-tpl.js"></script>
<script src="js/share.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/vault.js"></script>
<script src="js/cloud.js"></script>
<script src="js/notes-page.js"></script>
<script src="js/glyph.js"></script>
<script src="js/ai.js"></script>
<script src="js/ai-notes.js"></script>
<script src="js/draw.js"></script>
<script src="js/notes-att.js"></script>
<script src="js/conflict.js"></script>
<script src="js/photo.js"></script>
<script src="js/notes-share.js"></script>
</body>
</html>
