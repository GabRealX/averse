<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVERSE — carnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<meta name="description" content="AVERSE · carnet — notes liées et graphe. Tout reste dans ton navigateur.">
<meta name="theme-color" content="#06060a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/notes.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/ascii.css">
<script src="js/core.js"></script>
</head>
<body>

<div class="bar">
  <div class="bar-left">
    <button class="ico-btn menu-btn" id="menuBtn" aria-label="Notes">☰</button>
    <div class="logo">AVERSE <b>/ CARNET</b></div>
    <a class="back" href="index.html">← accueil</a>
  </div>
  <div class="bar-right">
    <div class="seg">
      <button class="active" data-v="editor">Éditeur</button>
      <button data-v="graph">Graphe</button>
    </div>
    <button class="ico-btn" id="styleBtn" data-style-label onclick="toggleStyle()">style : normal</button>
    <button class="ico-btn" id="fileBtn" title="Synchro : lie le carnet à un fichier (ex. dans ton dossier OneDrive / Google Drive)">Fichier</button>
    <span class="sync-state" id="syncState" role="status" aria-live="polite" hidden></span>
    <button class="ico-btn" id="exportBtn">Export</button>
    <button class="ico-btn" id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button class="ico-btn" id="bakOut" title="Tout AVERSE dans un fichier : notes, favoris, réglages (sans secrets)">Sauvegarde</button>
    <button class="ico-btn" id="bakIn" title="Restaurer une sauvegarde complète (fusion)">Restaurer</button>
    <input type="file" id="bakFile" accept=".json,application/json" style="display:none">
    <button class="ico-btn install-btn" data-install hidden>Installer</button>
  </div>
</div>

<div class="app">
  <!-- BARRE LATÉRALE -->
  <aside class="side" id="side">
    <div class="side-top">
      <input class="search" id="search" placeholder="Rechercher…">
      <button class="btn primary" id="newBtn">+ Nouvelle note</button>
      <select class="tpl" id="tplSel" aria-label="Modèle de note"><option value="">Note vide</option><option value="tp">Modèle : compte-rendu de TP</option><option value="cours">Modèle : fiche de cours</option><option value="stage">Modèle : journal de stage</option><option value="adressage">Modèle : plan d'adressage</option><option value="incident">Modèle : dépannage</option><option value="taches">Modèle : liste de tâches</option></select>
      <div class="tagbar" id="tagbar"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <!-- ZONE PRINCIPALE -->
  <main class="main" id="main">
    <div class="blank" id="blank" style="display:none">
      <b>Carnet vide</b>
      <div>Crée une note pour commencer à garder des traces.</div>
      <button class="btn primary" onclick="document.getElementById('newBtn').click()">+ Nouvelle note</button>
    </div>

    <div class="editor">
      <div class="ed-head">
        <input class="title-in" id="titleIn" placeholder="Titre de la note">
        <div class="ed-row">
          <span>Tags</span>
          <input class="tags-in" id="tagsIn" placeholder="séparés par des virgules">
          <button class="del" id="mdBtn" style="margin-left:auto">Exporter .md</button>
          <button class="del" id="pdfBtn" style="margin-left:0" title="Vue d'impression propre → « Enregistrer au format PDF »">PDF</button>
          <button class="del" id="delBtn" style="margin-left:0">Supprimer</button>
        </div>
      </div>
      <div class="panes-tabs">
        <button class="active" data-p="write">Écrire</button>
        <button data-p="prev">Aperçu</button>
      </div>
      <div class="panes">
        <div class="pane write shown" id="paneWrite">
          <textarea id="bodyIn" placeholder="Écris ici…&#10;&#10;# Titre   **gras**   *italique*   `code`&#10;- liste   1. numérotée   - [ ] tâche&#10;```bloc de code```   | tableau |   > citation&#10;[[Lien vers une note]]   [texte](https://lien.fr)"></textarea>
        </div>
        <div class="pane" id="panePrev"><div id="preview"></div></div>
      </div>
      <div class="backlinks" id="backlinks"></div>
    </div>

    <div class="graph-wrap" id="graphWrap">
      <canvas id="graph"></canvas>
      <div class="graph-hint">clic : ouvrir · glisser un nœud : déplacer · glisser le fond : déplacer la vue · clic droit : actions</div>
      <div class="graph-empty" id="graphEmpty" style="display:none">Aucune note à afficher.</div>
    </div>
  </main>
</div>

<script src="js/backup.js"></script>
<script src="js/math.js"></script>
<script src="js/keys.js"></script>
<script src="js/pwa.js"></script>
<script src="js/ctxmenu.js"></script>
<script src="js/notes.js"></script>
<script>if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
